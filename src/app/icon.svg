<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Read at 16px, in a row of other tabs, at a glance.
    Two interlocking rings is the brand mark, but at favicon size the overlap
    fills in and both bands merge into one blob — so this is the mark reduced
    to a single heavy band with a solitaire: one shape, one hole, one accent,
    nothing thinner than 2px once scaled down. The deep wine field is doing as
    much work as the ring, because almost nothing else in a tab strip is
    that colour.
  -->
  <rect width="64" height="64" rx="14" fill="#7A2544" />
  <rect width="64" height="64" rx="14" fill="url(#sheen)" />

  <circle
    cx="32"
    cy="35"
    r="14.5"
    fill="none"
    stroke="#F6F2F4"
    stroke-width="9"
  />

  <!-- The stone, cut rather than round: a filled circle above a ring reads as a
       generic user glyph, a lozenge reads as a gem. -->
  <path d="M32 5.5 40 13.5 32 21.5 24 13.5Z" fill="#7A2544" />
  <path d="M32 8 37.5 13.5 32 19 26.5 13.5Z" fill="#EFA9BE" />

  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>
</svg>
